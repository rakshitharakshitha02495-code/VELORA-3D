<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VELORA FASHION | Luxury Womenswear</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Plus+Jakarta+Sans:wght@300;400;500&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #070608;
      color: #f7f3f5;
      font-family: 'Plus Jakarta Sans', sans-serif;
      overflow-x: hidden;
    }

    /* 3D Canvas Background */
    #webgl-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
      pointer-events: none;
    }

    /* Overlay Content */
    .content {
      position: relative;
      z-index: 2;
    }

    /* Navigation */
    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 2rem 6%;
      background: rgba(7, 6, 8, 0.6);
      backdrop-filter: blur(15px);
      border-bottom: 1px solid rgba(242, 196, 206, 0.08);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .logo-img {
      height: 48px;
      width: auto;
      object-fit: contain;
      filter: drop-shadow(0 2px 10px rgba(242, 196, 206, 0.25));
    }

    .nav-links {
      display: flex;
      gap: 2.5rem;
      list-style: none;
      font-size: 0.8rem;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    .nav-links a {
      color: #c9c3c7;
      text-decoration: none;
      transition: color 0.3s ease;
    }

    .nav-links a:hover {
      color: #f2c4ce;
    }

    /* Hero Section */
    .hero {
      height: 90vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 0 1.5rem;
    }

    .hero-logo-large {
      max-width: 280px;
      width: 100%;
      height: auto;
      margin-bottom: 2rem;
      filter: drop-shadow(0 5px 20px rgba(242, 196, 206, 0.2));
      animation: floatLogo 4s ease-in-out infinite;
    }

    @keyframes floatLogo {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    .hero h1 {
      font-family: 'Cinzel', serif;
      font-size: 3.5rem;
      font-weight: 500;
      letter-spacing: 6px;
      margin-bottom: 1rem;
      background: linear-gradient(135deg, #ffffff 30%, #f2c4ce 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hero p {
      font-size: 1.05rem;
      color: #a39b9f;
      max-width: 500px;
      margin-bottom: 2.5rem;
      line-height: 1.8;
      font-weight: 300;
      letter-spacing: 1px;
    }

    .btn {
      padding: 1rem 3rem;
      border: 1px solid #f2c4ce;
      border-radius: 50px;
      background: linear-gradient(135deg, rgba(242, 196, 206, 0.15), rgba(242, 196, 206, 0.05));
      color: #ffffff;
      font-size: 0.8rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      cursor: pointer;
      backdrop-filter: blur(10px);
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .btn:hover {
      background: #f2c4ce;
      color: #070608;
      box-shadow: 0 10px 30px rgba(242, 196, 206, 0.35);
      transform: translateY(-3px);
    }

    /* Collections Showcase */
    .collections {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 2.5rem;
      padding: 6rem 8%;
      max-width: 1350px;
      margin: 0 auto;
    }

    .card {
      background: linear-gradient(145deg, rgba(255, 255, 255, 0.03), rgba(255, 255, 255, 0.01));
      border: 1px solid rgba(242, 196, 206, 0.12);
      backdrop-filter: blur(15px);
      padding: 3.5rem 2.5rem;
      border-radius: 16px;
      text-align: center;
      transition: all 0.4s ease;
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 2px;
      background: linear-gradient(90deg, transparent, #f2c4ce, transparent);
      opacity: 0;
      transition: opacity 0.4s ease;
    }

    .card:hover {
      transform: translateY(-8px);
      border-color: rgba(242, 196, 206, 0.4);
      background: linear-gradient(145deg, rgba(242, 196, 206, 0.06), rgba(255, 255, 255, 0.02));
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
    }

    .card:hover::before {
      opacity: 1;
    }

    .card h3 {
      font-family: 'Cinzel', serif;
      font-size: 1.4rem;
      letter-spacing: 3px;
      margin-bottom: 1rem;
      color: #f2c4ce;
      font-weight: 500;
    }

    .card p {
      color: #9c9498;
      line-height: 1.7;
      font-size: 0.95rem;
      font-weight: 300;
    }

    /* Footer */
    footer {
      text-align: center;
      padding: 3rem 0;
      color: #6b6367;
      font-size: 0.8rem;
      letter-spacing: 2px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
    }

    @media (max-width: 768px) {
      .hero h1 { font-size: 2.5rem; }
      .nav-links { display: none; }
    }
  </style>
</head>
<body>

  <!-- Background 3D Canvas -->
  <canvas id="webgl-canvas"></canvas>

  <div class="content">
    <nav>
      <!-- Logo Embedded Directly via Base64 -->
