<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VELORA FASHION | Luxury Womenswear</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=Montserrat:wght@200;300;400;500&display=swap');

    :root {
      --bg-color: #0c0b0e;
      --card-bg: rgba(255, 255, 255, 0.02);
      --border-color: rgba(235, 185, 195, 0.15);
      --accent-pink: #ebb3c3;
      --text-main: #f9f6f8;
      --text-muted: #9e979f;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      scroll-behavior: smooth;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: 'Montserrat', sans-serif;
      overflow-x: hidden;
    }

    /* 3D Background Canvas */
    #webgl-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
      pointer-events: none;
    }

    /* Wrapper */
    .site-wrapper {
      position: relative;
      z-index: 2;
    }

    /* Header & Navigation */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 2rem 5%;
      background: rgba(12, 11, 14, 0.75);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand-logo {
      height: 50px;
      width: auto;
      object-fit: contain;
      filter: drop-shadow(0 2px 8px rgba(235, 185, 195, 0.3));
    }

    .nav-links {
      display: flex;
      gap: 3rem;
      list-style: none;
      font-size: 0.75rem;
      letter-spacing: 4px;
      text-transform: uppercase;
      font-weight: 300;
    }

    .nav-links a {
      color: var(--text-main);
      text-decoration: none;
      transition: color 0.3s ease;
      position: relative;
    }

    .nav-links a::after {
      content: '';
      position: absolute;
      width: 0;
      height: 1px;
      bottom: -4px;
      left: 0;
      background-color: var(--accent-pink);
      transition: width 0.3s ease;
    }

    .nav-links a:hover {
      color: var(--accent-pink);
    }

    .nav-links a:hover::after {
      width: 100%;
    }

    /* Hero Section */
    .hero {
      min-height: 85vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 4rem 1.5rem;
    }

    .hero-emblem {
      max-width: 240px;
      width: 100%;
      height: auto;
      margin-bottom: 2rem;
      filter: drop-shadow(0 6px 16px rgba(235, 185, 195, 0.25));
      animation: gentleFloat 5s ease-in-out infinite;
    }

    @keyframes gentleFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    .hero h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 4.2rem;
      font-weight: 300;
      letter-spacing: 8px;
      margin-bottom: 1.2rem;
      color: #ffffff;
      text-transform: uppercase;
    }

    .hero h1 span {
      color: var(--accent-pink);
      font-style: italic;
    }

    .hero p {
      font-size: 1rem;
      color: var(--text-muted);
      max-width: 580px;
      margin-bottom: 3rem;
      line-height: 1.9;
      font-weight: 200;
      letter-spacing: 1.5px;
    }

    .cta-btn {
      padding: 1.1rem 3.2rem;
      border: 1px solid var(--accent-pink);
      border-radius: 50px;
      background: rgba(235, 185, 195, 0.05);
      color: var(--text-main);
      font-size: 0.75rem;
      letter-spacing: 4px;
      text-transform: uppercase;
      cursor: pointer;
      backdrop-filter: blur(10px);
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      text-decoration: none;
    }

    .cta-btn:hover {
      background: var(--accent-pink);
      color: var(--bg-color);
      box-shadow: 0 12px 35px rgba(235, 185, 195, 0.3);
      transform: translateY(-3px);
    }

    /* Collections Section */
    .collections-container {
      max-width: 1300px;
      margin: 0 auto;
      padding: 6rem 5%;
    }

    .section-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 2.5rem;
      text-align: center;
      letter-spacing: 5px;
      margin-bottom: 4rem;
      font-weight: 300;
      text-transform: uppercase;
      color: var(--text-main);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 2.5rem;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      backdrop-filter: blur(15px);
      padding: 3.5rem 2.5rem;
      border-radius: 12px;
      text-align: left;
      transition: all 0.4s ease;
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--accent-pink), transparent);
      opacity: 0;
      transition: opacity 0.4s ease;
    }

    .card:hover {
      transform: translateY(-8px);
      border-color: rgba(235, 185, 195, 0.4);
      background: rgba(235, 185, 195, 0.03);
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6);
    }

    .card:hover::before {
      opacity: 1;
    }

    .card span {
      font-size: 0.7rem;
      letter-spacing: 3px;
      color: var(--accent-pink);
      text-transform: uppercase;
      display: block;
      margin-bottom: 1rem;
    }

    .card h3 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.8rem;
      letter-spacing: 2px;
      margin-bottom: 1rem;
      font-weight: 400;
    }

    .card p {
      color: var(--text-muted);
      line-height: 1.8;
      font-size: 0.9rem;
      font-weight: 200;
    }

    /* Footer */
    footer {
      text-align: center;
      padding: 4rem 0;
      color: var(--text-muted);
      font-size: 0.75rem;
      letter-spacing: 3px;
      border-top: 1px solid var(--border-color);
      text-transform: uppercase;
    }

    @media (max-width: 768px) {
      .hero h1 { font-size: 2.8rem; letter-spacing: 4px; }
      .nav-links { display: none; }
    }
  </style>
</head>
