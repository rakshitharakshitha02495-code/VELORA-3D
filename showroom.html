
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VELORA | Luxury 3D Showroom</title>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"}}
</script>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#08252d;color:#fff;font-family:Poppins,sans-serif;overflow:hidden}
#world{position:fixed;inset:0}
canvas{display:block}

header{
 position:absolute;top:0;left:0;width:100%;
 padding:20px 6%;display:flex;
 justify-content:space-between;align-items:center;
 z-index:5;background:linear-gradient(#031d26dd,transparent)
}
.logo{font:600 30px 'Playfair Display';letter-spacing:5px;color:#f8c030}
nav{display:flex;gap:25px}
nav a{color:white;text-decoration:none;font-size:11px;letter-spacing:2px}
nav a:hover{color:#f8c030}

.heading{
 position:absolute;left:6%;top:27%;
 z-index:3;max-width:340px;pointer-events:none
}
.heading small{letter-spacing:4px;color:#f8c030;font-size:10px}
.heading h1{
 font:500 clamp(44px,6vw,75px) 'Playfair Display';
 line-height:1.12;margin:20px 0
}
.heading h1 span{color:#f8c030}
.heading p{font-size:12px;color:#e0e0d7;line-height:2;margin-bottom:25px}

.btn{
 display:inline-block;background:#f8c030;color:#08252d;
 padding:13px 23px;text-decoration:none;
 font-size:11px;letter-spacing:2px;
 border:0;cursor:pointer;pointer-events:auto;
 transition:.3s
}
.btn:hover{background:#fff;transform:translateY(-3px)}

.hint{
 position:absolute;bottom:22px;left:50%;
 transform:translateX(-50%);z-index:4;
 font-size:10px;letter-spacing:2px;color:#eee;
 text-align:center;width:90%
}

.walk{
 position:absolute;right:5%;bottom:28px;z-index:5;
 background:#f8c030;color:#08252d;border:0;
 padding:13px 20px;font-size:11px;cursor:pointer
}

.panel{
 display:none;position:absolute;right:5%;top:25%;
 width:280px;padding:25px;background:#062a34f5;
 border:1px solid #d8aa43;z-index:8;
 box-shadow:0 15px 50px #0007
}
.panel h2{font:26px 'Playfair Display';color:#f8c030;margin-bottom:10px}
.panel p{font-size:12px;line-height:1.8;color:#eee}
.panel .price{font-size:19px;color:#f8c030;margin:15px 0}
.close{float:right;cursor:pointer;color:#f8c030;font-size:20px}

@media(max-width:650px){
 header{padding:15px 5%}
 .logo{font-size:22px}
 nav{gap:12px}
 nav a{font-size:8px}
 .heading{top:auto;bottom:95px;left:6%;max-width:270px}
 .heading h1{font-size:45px;margin:10px 0}
 .heading p{font-size:10px;margin-bottom:12px}
 .heading .btn{padding:10px 15px}
 .hint{font-size:8px;bottom:10px}
 .walk{bottom:48px;right:5%;padding:10px}
 .panel{top:22%;right:5%;width:220px;padding:17px}
}
</style>
</head>

<body>
<div id="world"></div>

<header>
 <div class="logo">VELORA.</div>
 <nav>
  <a href="index.html">HOME</a>
  <a href="showroom.html">SHOWROOM</a>
 </nav>
</header>

<div class="heading" id="heading">
 <small>THE LUXURY EXPERIENCE</small>
 <h1>Welcome to<br><span>Velora.</span></h1>
 <p>Discover a world of fashion, elegance and individuality. Explore our virtual boutique.</p>
 <button class="btn" onclick="enterStore()">ENTER SHOWROOM</button>
</div>

<div class="hint" id="hint">
 DRAG TO LOOK AROUND · CLICK A MANNEQUIN TO EXPLORE
</div>

<button class="walk" id="walk" onclick="toggleWalk()">START WALK MODE</button>

<div class="panel" id="panel">
 <span class="close" onclick="closePanel()">✕</span>
 <h2 id="productName">Collection</h2>
 <p id="productDescription"></p>
 <div class="price" id="productPrice"></div>
 <p>VELORA FASHION · NEW COLLECTION</p>
</div>

<script type="module">
import * as THREE from 'three';

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x102c32);
scene.fog=new THREE.Fog(0x102c32,25,48);

const camera=new THREE.PerspectiveCamera(
 50,innerWidth/innerHeight,.1,100
);
camera.position.set(0,5,17);
camera.lookAt(0,2,0);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.4;
document.getElementById('world').appendChild(renderer.domElement);

// MATERIALS
const gold=new THREE.MeshStandardMaterial({
 color:0xe1b34f,metalness:.8,roughness:.22
});
const cream=new THREE.MeshStandardMaterial({
 color:0xece4d6,roughness:.38
});
const navy=new THREE.MeshStandardMaterial({
 color:0x0b3440,roughness:.3
});
const marble=new THREE.MeshStandardMaterial({
 color:0xe5ddcf,roughness:.22,metalness:.08
});

// LIGHTING
scene.add(new THREE.HemisphereLight(0xffedcf,0x30464b,2));

function addSpot(x,y,z,color,intensity){
 const l=new THREE.SpotLight(color,intensity,35,.6,.5,1);
 l.position.set(x,y,z);
 l.castShadow=true;
 scene.add(l);
 l.target.position.set(0,0,0);
 scene.add(l.target);
}
addSpot(-7,12,7,0xffe2b0,200);
addSpot(0,13,0,0xffffff,250);
addSpot(7,12,7,0xffd68b,200);

const glow=new THREE.PointLight(0xf8c030,70,18);
glow.position.set(0,7,-6);
scene.add(glow);

// FLOOR
const floor=new THREE.Mesh(
 new THREE.PlaneGeometry(40,40),marble
);
floor.rotation.x=-Math.PI/2;
floor.position.y=-.12;
floor.receiveShadow=true;
scene.add(floor);

// BACK WALL
function box(w,h,d,x,y,z,mat){
 const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);
 m.position.set(x,y,z);
 m.castShadow=true;
 m.receiveShadow=true;
 scene.add(m);
 return m;
}
box(24,13,.5,0,6,-9,cream);
box(.5,13,18,-12,6,0,navy);
box(.5,13,18,12,6,0,navy);

// GOLDEN WALL PANELS
for(let x=-9;x<=9;x+=4.5){
 box(3.3,7,.12,x,4.5,-8.7,
 new THREE.MeshStandardMaterial({color:0xd8ccb7}));
 box(3.35,.07,.16,x,8.05,-8.55,gold);
}

// GOLDEN ARCHES
for(let x of [-7,0,7]){
 const arch=new THREE.Mesh(
  new THREE.TorusGeometry(2.1,.09,16,80,Math.PI),
  gold
 );
 arch.position.set(x,3,-8.45);
 scene.add(arch);
}

// SIGN BOARD
box(5,1.1,.25,0,9,-8.35,navy);

const signCanvas=document.createElement('canvas');
signCanvas.width=1024;
signCanvas.height=220;
const ctx=signCanvas.getContext('2d');
ctx.fillStyle='#0b3440';
ctx.fillRect(0,0,1024,220);
ctx.font='bold 100px Georgia';
ctx.textAlign='center';
ctx.fillStyle='#f8c030';
ctx.fillText('VELORA',512,145);

const signTexture=new THREE.CanvasTexture(signCanvas);
const signFace=new THREE.Mesh(
 new THREE.PlaneGeometry(4.9,1),
 new THREE.MeshBasicMaterial({map:signTexture})
);
signFace.position.set(0,9,-8.18);
scene.add(signFace);

// CEILING GOLDEN LIGHTS
for(let x of [-7,-2.3,2.3,7]){
 const ring=new THREE.Mesh(
  new THREE.TorusGeometry(1,.035,12,80),
  gold
 );
 ring.rotation.x=Math.PI/2;
 ring.position.set(x,11,-2);
 scene.add(ring);
}

// PLATFORMS
const products=[];

const productData=[
 {
  name:'Western Collection',
  description:'Explore modern western outfits and stylish everyday fashion.',
  price:'Explore our latest styles',
  color:0x9d3e55
 },
 {
  name:'Elegant Dresses',
  description:'Discover graceful dresses designed for special occasions.',
  price:'Explore our latest styles',
  color:0xe6d8c4
 },
 {
  name:'Traditional Kurtis',
  description:'Beautiful traditional styles with a modern touch.',
  price:'Explore our latest styles',
  color:0x246d69
 },
 {
  name:'Casual Collection',
  description:'Comfortable and fashionable outfits for everyday wear.',
  price:'Explore our latest styles',
  color:0xb78c48
 }
];

function makeMannequin(x,z,color,index){
 const group=new THREE.Group();
 group.position.set(x,.5,z);
 scene.add(group);

 const fabric=new THREE.MeshStandardMaterial({
  color,roughness:.42
 });
 const skin=new THREE.MeshStandardMaterial({
  color:0xc99576,roughness:.6
 });

 function add(geo,mat,px,py,pz){
  const m=new THREE.Mesh(geo,mat);
  m.position.set(px,py,pz);
  m.castShadow=true;
  group.add(m);
  return m;
 }

 // Head
 add(new THREE.SphereGeometry(.27,32,32),skin,0,2.05,0);

 // Neck
 add(new THREE.CylinderGeometry(.12,.13,.28,20),skin,0,1.73,0);

 // Upper body
 add(new THREE.CylinderGeometry(.3,.44,.95,32),fabric,0,1.1,0);

 // Waist
 add(new THREE.CylinderGeometry(.32,.34,.3,32),fabric,0,.5,0);

 // Flowing skirt / dress
 add(new THREE.CylinderGeometry(.36,.77,1.2,48),fabric,0,-.25,0);

 // Sleeves
 for(let s of [-1,1]){
  const sleeve=add(
   new THREE.CapsuleGeometry(.105,.7,5,16),
   fabric,s*.43,1.1,0
  );
  sleeve.rotation.z=s*.25;
 }

 // Legs
 for(let s of [-1,1]){
  add(new THREE.CapsuleGeometry(.105,.45,5,16),
   skin,s*.18,-1.05,0);
 }

 // Pedestal
 const base=new THREE.Mesh(
  new THREE.CylinderGeometry(.95,1.08,.25,64),
  gold
 );
 base.position.y=-1.75;
 base.castShadow=true;
 group.add(base);

 const top=new THREE.Mesh(
  new THREE.CylinderGeometry(.9,.9,.09,64),
  cream
 );
 top.position.y=-1.58;
 group.add(top);

 group.userData.productIndex=index;
 products.push(group);

 return group;
}

// DISPLAY POSITIONS
const models=[];
models.push(makeMannequin(-7,-2,productData[0].color,0));
models.push(makeMannequin(-2.3,-3,productData[1].color,1));
models.push(makeMannequin(2.3,-3,productData[2].color,2));
models.push(makeMannequin(7,-2,productData[3].color,3));

// CLOTHING RACKS
function rack(x,z){
 const group=new THREE.Group();
 group.position.set(x,0,z);
 scene.add(group);

 const rod=new THREE.Mesh(
  new THREE.CylinderGeometry(.045,.045,4,16),gold
 );
 rod.position.y=2;
 group.add(rod);

 const bar=new THREE.Mesh(
  new THREE.CylinderGeometry(.045,.045,3.5,16),gold
 );
 bar.rotation.z=Math.PI/2;
 bar.position.y=4;
 group.add(bar);

 const colors=[0x9d3e55,0xe6d8c4,0x246d69,0xb78c48,0x263e51];

 colors.forEach((color,i)=>{
  const hanger=new THREE.Group();
  hanger.position.set(-1.25+i*.62,3.8,0);

  const hook=new THREE.Mesh(
   new THREE.TorusGeometry(.09,.018,8,20),
   gold
  );
  hanger.add(hook);

  const dress=new THREE.Mesh(
   new THREE.CylinderGeometry(.18,.3,.95,24),
   new THREE.MeshStandardMaterial({color,roughness:.5})
  );
  dress.position.y=-.55;
  hanger.add(dress);
  group.add(hanger);
 });

 scene.add(group);
}
rack(-10,-1);
rack(10,-1);

// DECORATIVE FLOWERS
for(let i=0;i<18;i++){
 const sphere=new THREE.Mesh(
  new THREE.SphereGeometry(.035,8,8),
  new THREE.MeshBasicMaterial({color:0xf8c030})
 );
 sphere.position.set(
  (Math.random()-.5)*24,
  Math.random()*9,
  -8+Math.random()*6
 );
 scene.add(sphere);
}

// PRODUCT CLICK
const raycaster=new THREE.Raycaster();
const mouse=new THREE.Vector2();

window.addEventListener('click',e=>{
 if(e.target.closest('button')||e.target.closest('a'))return;

 mouse.x=e.clientX/innerWidth*2-1;
 mouse.y=-(e.clientY/innerHeight)*2+1;
 raycaster.setFromCamera(mouse,camera);

 const hits=raycaster.intersectObjects(models,true);

 if(hits.length){
  let obj=hits[0].object;
  while(obj.parent&&!obj.userData.productIndex&&obj.parent!==scene){
   obj=obj.parent;
  }

  const index=obj.userData.productIndex;
  if(index===undefined)return;

  const p=productData[index];
  document.getElementById('productName').textContent=p.name;
  document.getElementById('productDescription').textContent=p.description;
  document.getElementById('productPrice').textContent=p.price;
  document.getElementById('panel').style.display='block';
 }
});

window.closePanel=()=>{
 document.getElementById('panel').style.display='none';
};

// CAMERA CONTROLS
let dragging=false;
let lastX=0,lastY=0;
let angle=0,vertical=0;
let walkMode=false;
let keys={};

renderer.domElement.addEventListener('pointerdown',e=>{
 dragging=true;
 lastX=e.clientX;
 lastY=e.clientY;
});

window.addEventListener('pointerup',()=>dragging=false);

window.addEventListener('pointermove',e=>{
 if(!dragging)return;
 angle-=(e.clientX-lastX)*.004;
 vertical+=(e.clientY-lastY)*.004;
 vertical=Math.max(-.35,Math.min(.35,vertical));
 lastX=e.clientX;
 lastY=e.clientY;
});

window.addEventListener('keydown',e=>{
 keys[e.key.toLowerCase()]=true;
});
window.addEventListener('keyup',e=>{
 keys[e.key.toLowerCase()]=false;
});

let zoom=17;
renderer.domElement.addEventListener('wheel',e=>{
 zoom=Math.max(11,Math.min(23,zoom+e.deltaY*.008));
},{passive:true});

window.toggleWalk=()=>{
 walkMode=!walkMode;
 document.getElementById('walk').textContent=
 walkMode?'EXIT WALK MODE':'START WALK MODE';
 document.getElementById('hint').textContent=
 walkMode?'USE W A S D TO MOVE · DRAG TO LOOK AROUND':
 'DRAG TO LOOK AROUND · CLICK A MANNEQUIN TO EXPLORE';
};

window.enterStore=()=>{
 document.getElementById('heading').style.display='none';
 walkMode=true;
 document.getElementById('walk').textContent='EXIT WALK MODE';
};

function animate(){
 requestAnimationFrame(animate);

 // Slowly moving mannequins
 models.forEach((m,i)=>{
  m.rotation.y=Math.sin(Date.now()*.0005+i)*.06;
 });

 if(walkMode){
  const forward=new THREE.Vector3(
   -Math.sin(angle),0,-Math.cos(angle)
  );
  const right=new THREE.Vector3(
   Math.cos(angle),0,-Math.sin(angle)
  );

  const speed=.055;
  if(keys.w||keys.arrowup)camera.position.addScaledVector(forward,speed);
  if(keys.s||keys.arrowdown)camera.position.addScaledVector(forward,-speed);
  if(keys.a||keys.arrowleft)camera.position.addScaledVector(right,-speed);
  if(keys.d||keys.arrowright)camera.position.addScaledVector(right,speed);

  camera.position.x=THREE.MathUtils.clamp(camera.position.x,-9,9);
  camera.position.z=THREE.MathUtils.clamp(camera.position.z,-7,8);
 }else{
  camera.position.x=Math.sin(angle)*zoom*.3;
  camera.position.z=zoom;
 }

 camera.lookAt(
  camera.position.x+Math.sin(angle)*10,
  2.5-vertical*5,
  camera.position.z-Math.cos(angle)*10
 );

 renderer.render(scene,camera);
}
animate();

window.addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
